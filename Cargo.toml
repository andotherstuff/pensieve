[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license-file = "LICENSE"
authors = ["JeffG <j@jeffg.me>"]
description = "All of Nostr, at your fingertips."
readme = "README.md"
homepage = "https://github.com/andotherstuff/pensieve"
repository = "https://github.com/andotherstuff/pensieve"
documentation = "https://docs.rs/pensieve"
keywords = ["nostr", "memory", "knowledge", "analytics", "data"]
categories = ["database", "analytics", "data"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Protobuf
prost = "0.13"

# ClickHouse
clickhouse = { version = "0.13", features = ["lz4", "chrono", "native-tls"] }

# Storage
rocksdb = "0.23"

# Parquet archive
arrow-array = "59.1"
arrow-schema = "59.1"
parquet = { version = "59.1", default-features = false, features = ["arrow", "zstd"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Encoding
hex = "0.4"
sha2 = "0.10"
rustix = { version = "=1.1.2", features = ["fs"] }

# AWS S3
aws-config = "1.13"
aws-sdk-s3 = { version = "1.154", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }

# Concurrency
crossbeam-channel = "0.5"
futures-util = "0.3"
parking_lot = "0.12"
num_cpus = "1.16"

# Nostr
nostr = "0.44.7"
nostr-sdk = "0.44"
notepack = { git = "https://github.com/erskingardner/notepack" }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Signals
ctrlc = { version = "3.4", features = ["termination"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# Lakehouse analytics
# Keep the validated analytics engine during infrastructure maintenance. The newer
# engine's published bundle lacks required offline extensions. Bundling disables
# libduckdb-sys's optional download/extraction path (its zip build dependency).
duckdb = { version = "=1.10505.0", default-features = false, features = ["bundled", "parquet"] }
datasketches = { version = "0.4.0", default-features = false, features = ["hll"] }

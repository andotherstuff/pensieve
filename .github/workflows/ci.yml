name: CI

# Mirrors `just precommit` (fmt + clippy + test) and shards the test suite across
# multiple runners with cargo-nextest.

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs for the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  ops-test:
    name: operational tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B -m unittest discover -s ops/tests -p 'test_*.py'

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Same as `just fmt-check`.
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The `rocksdb` crate builds librocksdb-sys via bindgen, which needs libclang.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev protobuf-compiler
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      # Same as `just clippy`.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (shard ${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev protobuf-compiler
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Split the suite across runners; nextest assigns each test to one shard.
      - run: cargo nextest run --workspace --partition count:${{ matrix.partition }}/3

  doctest:
    name: doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev protobuf-compiler
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doctest
      # nextest does not run doctests, so cover them separately.
      - run: cargo test --workspace --doc

  clickhouse:
    name: ClickHouse integration (24.8)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # Same release line as production.
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev protobuf-compiler
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clickhouse
      # Same as `just test-clickhouse`.
      - run: cargo test -p pensieve-preview --test compact_lookups -- --ignored
        env:
          PENSIEVE_TEST_CLICKHOUSE_URL: http://localhost:8123

  # Single required status check that aggregates the matrix + other jobs, so branch
  # protection only needs to require "CI success".
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, doctest, ops-test, clickhouse]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if echo '${{ join(needs.*.result, ',') }}' | grep -qE 'failure|cancelled'; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."

# Pensieve Production Docker Compose
#
# This runs the infrastructure services (ClickHouse, Grafana, Prometheus, Caddy).
# The Rust binaries (API, Ingester, Preview) run as native binaries via systemd.
#
# Normally manage infrastructure through systemd (ops/systemd/pensieve.service):
#   sudo systemctl restart pensieve
#
# Manual commands must pass the production env file. Without it (or with a
# partial file) Compose falls back to defaults such as DOMAIN=localhost and
# GRAFANA_PASSWORD=admin:
#   Start:   docker compose --env-file /etc/pensieve/pensieve.env up -d
#   Stop:    docker compose --env-file /etc/pensieve/pensieve.env down
#   Logs:    docker compose --env-file /etc/pensieve/pensieve.env logs -f
#   Status:  docker compose --env-file /etc/pensieve/pensieve.env ps
#
# Start Rust services:   sudo systemctl start pensieve-api pensieve-ingest pensieve-preview
# Stop Rust services:    sudo systemctl stop pensieve-ingest pensieve-api pensieve-preview

# Pin the Compose project name so every invocation (systemd, justfile, manual)
# uses the same project/volumes/network regardless of the directory name. Without
# this, Compose infers the project from the directory (ops/production -> "production"),
# which orphans the existing pensieve-deploy_* volumes and conflicts on container
# names. Kept in sync with --project-name in ops/systemd/pensieve.service.
name: pensieve-deploy

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Caddy - Reverse Proxy with Auto-HTTPS
  # ═══════════════════════════════════════════════════════════════════════════
  caddy:
    image: caddy:2-alpine
    container_name: pensieve-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Host CA store (Debian, kept current by apt), read-only: the images' own
      # bundles are pinned/old and still trusted the compromised eMudhra
      # intermediates on 2026-10-21. Mount the directories, not the bundle file,
      # so ca-certificates updates (new inodes) are seen without a recreate.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PREVIEW_DOMAIN=${PREVIEW_DOMAIN:-localhost:8081}
    # Allow container to reach host services (API, preview run on host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - grafana
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # ClickHouse - Analytics Database
  # ═══════════════════════════════════════════════════════════════════════════
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pensieve-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"  # HTTP interface (localhost only)
      - "127.0.0.1:9000:9000"  # Native TCP interface (localhost only)
    volumes:
      # Data directory (on fast SSD/NVMe)
      - /data/clickhouse:/var/lib/clickhouse
      # Logs
      - clickhouse_logs:/var/log/clickhouse-server
      # Host CA store (Debian, kept current by apt), read-only: the images' own
      # bundles are pinned/old and still trusted the compromised eMudhra
      # intermediates on 2026-10-21. Mount the directories, not the bundle file,
      # so ca-certificates updates (new inodes) are seen without a recreate.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
      # Custom config
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      # Users config (grafana user: SELECT on nostr only). A single-file bind
      # mount, resolved at each container start: `git merge` replaces the file,
      # so a running server keeps the old copy until the container is restarted
      # or recreated (docker restart, daemon restart and reboot included). To
      # roll out, see "Published ports and the grafana ClickHouse user" in
      # ops/RUNBOOK.md.
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      # Schema initialization (repo docs/, two levels up from ops/production/)
      - ../../docs/clickhouse_self_hosted.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - CLICKHOUSE_DB=nostr
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      # Password for the Grafana read-only user
      - CLICKHOUSE_GRAFANA_PASSWORD=${CLICKHOUSE_GRAFANA_PASSWORD:-changeme}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus - Metrics Collection
  # ═══════════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: pensieve-prometheus
    restart: unless-stopped
    # Localhost only, on 19090. Docker-published ports bypass UFW, so
    # "9090:9090" exposed the query API and, with --web.enable-lifecycle,
    # unauthenticated POST /-/quit and /-/reload to the whole internet.
    # Grafana uses http://prometheus:9090 over the compose network. The
    # external scraper (the monitoring VM) reaches :9090 through the host socket
    # ops/systemd/pensieve-prometheus-proxy.{socket,service}, which UFW gates;
    # that socket owns host port 9090, so do not publish 9090 here.
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/archive-alerts.yml:/etc/prometheus/archive-alerts.yml:ro
      - prometheus_data:/prometheus
      # Host CA store (Debian, kept current by apt), read-only: the images' own
      # bundles are pinned/old and still trusted the compromised eMudhra
      # intermediates on 2026-10-21. Mount the directories, not the bundle file,
      # so ca-certificates updates (new inodes) are seen without a recreate.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    # Linux: Allow container to reach host via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # Grafana - Dashboards
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.2.2
    container_name: pensieve-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Host CA store (Debian, kept current by apt), read-only: the images' own
      # bundles are pinned/old and still trusted the compromised eMudhra
      # intermediates on 2026-10-21. Mount the directories, not the bundle file,
      # so ca-certificates updates (new inodes) are seen without a recreate.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
      # Datasources/dashboards are configured directly on the running instance
      # (repo-managed Grafana provisioning was removed during the migration).
      # Mount relay database for SQLite datasource (read-only)
      - /data/relay-stats.db:/var/lib/grafana/relay-stats.db:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Configure for reverse proxy at /grafana/
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Install plugins on startup (datasources are configured on the running instance)
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource,frser-sqlite-datasource
    depends_on:
      - prometheus
      - clickhouse
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # Pensieve Rust Services (run as native binaries, not in Docker)
  # ═══════════════════════════════════════════════════════════════════════════
  # The ingester and API server run as native binaries managed by systemd.
  # This provides better I/O performance and simpler debugging.
  #
  # See ops/systemd/ for service files:
  #   - pensieve-api.service     (API server on port 8080)
  #   - pensieve-ingest.service  (Ingester with metrics on port 9091)
  #   - pensieve-preview.service (Preview server on port 8081)
  #
  # Start them with:
  #   sudo systemctl start pensieve-api
  #   sudo systemctl start pensieve-ingest
  #   sudo systemctl start pensieve-preview

volumes:
  clickhouse_logs:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  # Carried forward from the pre-rename deploy so the cutover reuses the existing
  # network instead of recreating it: the running containers are on this network,
  # and the br-pensieve bridge name may be referenced by host firewall rules.
  # Renaming would force a recreation — do that deliberately, not as a side effect
  # of the ops/ directory move.
  default:
    name: pensieve-deploy_default
    driver: bridge
    # Match the existing network and host firewall rules after recreation.
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
    driver_opts:
      com.docker.network.bridge.name: br-pensieve

groups:
  - name: pensieve-archive-integrity
    rules:
      - alert: PensieveArchiveRecoveryRequired
        expr: archive_recovery_required{job="ingest"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Pensieve archive admission is blocked pending recovery"
          description: "Preserve archive files and the recovery marker. Follow the archive recovery runbook; restarting must not bypass recovery."
      - alert: PensieveIngesterUnavailable
        expr: up{job="ingest"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pensieve ingester is unavailable"
          description: "Inspect systemd journal and archive recovery state before restarting."
  - name: pensieve-clickhouse-index
    rules:
      # The archive is unaffected; ClickHouse (and the API, Grafana and stats
      # built on it) is behind. The indexer retries on its own; no restart.
      - alert: PensieveClickHouseIndexBacklog
        expr: clickhouse_index_oldest_pending_seconds{job="ingest"} > 900
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse indexing is more than 15 minutes behind the archive"
          description: "Check ClickHouse health and the ingester journal for 'clickhouse index attempt failed' (retries on its own once ClickHouse accepts inserts) or 'failed to read segment' (needs an operator). See the RUNBOOK section on ClickHouse indexing."

# Prometheus configuration for Pensieve Production
#
# Scrapes metrics from:
# - Prometheus itself
# - ClickHouse (built-in metrics)
# - Pensieve ingester (native binary on host, port 9091)
# - node_exporter on the host (port 9100), if installed

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/archive-alerts.yml

scrape_configs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Prometheus self-monitoring
  # ═══════════════════════════════════════════════════════════════════════════
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ═══════════════════════════════════════════════════════════════════════════
  # Pensieve Ingester (native binary on host via systemd)
  # Metrics exposed on port 9091
  # ═══════════════════════════════════════════════════════════════════════════
  - job_name: 'ingest'
    static_configs:
      # host.docker.internal reaches the host from inside Docker (Linux needs extra_hosts)
      - targets: ['host.docker.internal:9091']

  # ═══════════════════════════════════════════════════════════════════════════
  # ClickHouse built-in Prometheus metrics
  # Metrics exposed on port 9363 inside the Docker network
  # ═══════════════════════════════════════════════════════════════════════════
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['pensieve-clickhouse:9363']

  # ═══════════════════════════════════════════════════════════════════════════
  # Node Exporter (host machine metrics)
  # Metrics exposed on port 9100
  # node_exporter is not part of compose.yml; it must be installed on the host
  # separately (this target is down if it is absent).
  # ═══════════════════════════════════════════════════════════════════════════
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
